<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>德语A1词汇高效练习坊 — 邀请与应答篇 (DeutschBlitz)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

        body{
            font-family:'Noto Sans SC',sans-serif;
            background:#F5F3FF;
            -webkit-tap-highlight-color:transparent;
        }

        .card-shake{
            animation:premium-shake .45s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes premium-shake{
            10%,90%{transform:translate3d(-2px,0,0);}
            20%,80%{transform:translate3d(4px,0,0);}
            30%,50%,70%{transform:translate3d(-5px,0,0);}
            40%,60%{transform:translate3d(5px,0,0);}
        }

        .pop-in{
            animation:popIn .3s cubic-bezier(0.34,1.56,0.64,1);
        }

        @keyframes popIn{
            0%{
                transform:scale(.95);
                opacity:0;
            }
            100%{
                transform:scale(1);
                opacity:1;
            }
        }
    </style>
</head>

<body class="text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased bg-violet-50/40">

<header class="p-4 bg-white/80 backdrop-blur-xl border-b border-violet-200/60 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <div class="flex items-center space-x-3">
        <button onclick="handleTap(); window.location.href='main.html'"
            class="py-1.5 px-3.5 bg-violet-50 hover:bg-violet-100 active:scale-95 text-violet-700 font-bold rounded-xl text-xs transition-all border border-violet-200 shadow-sm">
            ← 返回
        </button>

        <h1 class="text-sm font-black text-violet-600 tracking-wide">
            DeutschBlitz A1
        </h1>
    </div>

    <div class="text-slate-500 text-xs font-bold">
        进度:
        <span id="progress-text" class="text-slate-700 font-black tabular-nums">
            0 / 10
        </span>
    </div>
</header>

<main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md w-full mx-auto">

    <div class="w-full bg-slate-200 h-1.5 rounded-full mb-6 p-[1px] shadow-inner">
        <div id="game-progress"
            class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 h-full w-0 rounded-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(139,92,246,0.35)]">
        </div>
    </div>

    <div id="arena-card"
        class="w-full bg-white rounded-[32px] p-6 shadow-[0_20px_50px_rgba(139,92,246,0.06)] border border-violet-100/80 relative flex flex-col items-center min-h-[450px] justify-between transition-all duration-300 transform">

        <div class="w-full text-center py-1 flex flex-col items-center space-y-5">

            <div id="question-ctx"
                class="text-xs font-bold tracking-wide bg-violet-50 border border-violet-200 text-violet-700 rounded-full px-3 py-1 min-h-[26px] flex items-center transition-all">
                正在加载 Einladung & Antwort 核心词库...
            </div>

            <div id="question-text"
                class="text-xl font-black text-slate-800 w-full min-h-[120px] flex items-center justify-center tracking-wide leading-loose px-2">
            </div>
        </div>

        <div id="options-box" class="w-full grid grid-cols-1 gap-3.5 mt-4"></div>

        <div id="spell-box" class="w-full flex flex-col space-y-4 mt-4 hidden">

            <div id="spell-preview"
                class="w-full text-center min-h-[56px] flex items-center justify-center flex-wrap gap-1 py-2 bg-slate-50 rounded-2xl border border-slate-200 px-3 shadow-inner">
            </div>

            <div id="spell-chips" class="flex flex-wrap justify-center gap-2.5 pt-2"></div>

            <div class="flex justify-center pt-1">
                <button onclick="undoLastSpell()" id="btn-undo"
                    class="px-4 py-2 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-500 font-bold text-xs rounded-xl transition-all border border-slate-200 shadow-sm flex items-center gap-1.5">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                            d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 002-2H10.828a2 2 0 00-1.414.586L3 12z"/>
                    </svg>

                    撤回一步
                </button>
            </div>
        </div>
    </div>
</main>

<footer class="p-4 max-w-md w-full mx-auto flex gap-3.5 bg-white/70 backdrop-blur-md border-t border-violet-200 rounded-t-[24px] shadow-[0_-10px_30px_rgba(0,0,0,0.01)]">

    <button onclick="switchMode('blitz')" id="btn-mode-blitz"
        class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">
        ✉️ 词义辨析
    </button>

    <button onclick="switchMode('spell')" id="btn-mode-spell"
        class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">
        🧠 字母拼词
    </button>

    <button onclick="switchMode('context')" id="btn-mode-context"
        class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">
        🎉 语境填空
    </button>
</footer>

<div id="settle-modal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-xl flex items-center justify-center p-4 hidden z-50 transition-all duration-500">

    <div class="bg-white border border-violet-200 p-8 rounded-[36px] w-full max-w-sm text-center shadow-2xl transform scale-95 transition-all pop-in">

        <div class="w-16 h-16 bg-violet-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <span class="text-3xl animate-bounce">✉️</span>
        </div>

        <h3 class="text-xl font-black text-slate-800 tracking-tight">
            Einladung & Antwort 主题通关成功！
        </h3>

        <p class="text-slate-500 text-xs font-medium mt-2 mb-6 px-2 leading-relaxed">
            太棒了！你已经完美掌握 Goethe A1「邀请、接受与婉拒」的核心词汇与社交语境。
        </p>

        <button onclick="restartGame()"
            class="w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-white font-black py-4 px-6 rounded-2xl shadow-lg hover:opacity-95 active:scale-95 transition-all tracking-wider text-sm">
            再练一局
        </button>
    </div>
</div>

<script>

    // Goethe A1 邀请、接受与婉拒核心词库（严格筛选，语境唯一锁定）
    const a1Vocabulary = [
        {
            w:"die Einladung",
            t:"邀请，邀请函",
            s:"Vielen Dank für die ______ zu deiner Geburtstagsparty!",
            a:"Einladung",
            options: ["Einladung", "Absage", "Zeit", "Karte"]
        },
        {
            w:"einladen",
            t:"邀请（动词）",
            s:"Ich möchte dich herzlich zu meinem Geburtstag ______.",
            a:"einladen",
            options: ["einladen", "absagen", "mitbringen", "anrufen"]
        },
        {
            w:"die Party",
            t:"派对，聚会",
            s:"Wir feiern am Samstag eine große ______ im Garten.",
            a:"Party",
            options: ["Party", "Einladung", "Zeit", "Wohnung"]
        },
        {
            w:"kommen",
            t:"来，出席",
            s:"Es tut mir leid, ich kann morgen leider nicht ______.",
            a:"kommen",
            options: ["kommen", "absagen", "mitbringen", "feiern"]
        },
        {
            w:"die Zeit",
            t:"时间",
            s:"Hast du am Freitag ______? Wir wollen ins Kino gehen.",
            a:"Zeit",
            options: ["Zeit", "Lust", "Party", "Einladung"]
        },
        {
            w:"die Lust",
            t:"兴趣，意愿（常与 haben 连用）",
            s:"Ich habe heute keine ______, Hausaufgaben zu machen.",
            a:"Lust",
            options: ["Lust", "Zeit", "Party", "Geschenk"]
        },
        {
            w:"absagen",
            t:"拒绝，推掉（邀请）",
            s:"Ich muss leider ______, weil ich am Wochenende arbeiten muss.",
            a:"absagen",
            options: ["absagen", "zusagen", "einladen", "feiern"]
        },
        {
            w:"zusagen",
            t:"应允，接受（邀请）",
            s:"Das ist eine tolle Idee! Ich kann ______ und komme gerne.",
            a:"zusagen",
            options: ["zusagen", "absagen", "einladen", "mitbringen"]
        },
        {
            w:"feiern",
            t:"庆祝，开派对",
            s:"Wir ______ am Wochenende das Jubiläum von Oma.",
            a:"feiern",
            options: ["feiern", "einladen", "suchen", "bringen"]
        },
        {
            w:"das Geschenk",
            t:"礼物",
            s:"Ich kaufe ein schönes ______ für das Geburtstagskind.",
            a:"Geschenk",
            options: ["Geschenk", "Ticket", "Hotel", "Bier"]
        },
        {
            w:"mitbringen",
            t:"带来，携带",
            s:"Kann ich einen Salat oder Getränke zur Party ______?",
            a:"mitbringen",
            options: ["mitbringen", "einladen", "absagen", "kaufen"]
        },
        {
            w:"der Geburtstag",
            t:"生日",
            s:"Herzlichen Glückwunsch zum ______! Hier ist dein Geschenk.",
            a:"Geburtstag",
            options: ["Geburtstag", "Spaß", "Freitag", "Geschenk"]
        },
        {
            w:"gerne",
            t:"乐意地，高兴地",
            s:"Ja, ich komme sehr ______, danke für die Einladung!",
            a:"gerne",
            options: ["gerne", "leider", "nicht", "morgen"]
        },
        {
            w:"leider",
            t:"可惜，遗憾地",
            s:"Ich kann ______ nicht kommen, ich bin krank im Bett.",
            a:"leider",
            options: ["leider", "gerne", "hier", "sehr"]
        }
    ];

    const SoundFX = {
        ctx:null,

        init(){
            if(!this.ctx){
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        },

        play(type){
            try{
                this.init();

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.connect(gain);
                gain.connect(this.ctx.destination);

                if(type === 'correct'){
                    osc.type='sine';
                    osc.frequency.setValueAtTime(523.25,now);
                    osc.frequency.setValueAtTime(659.25,now + .08);

                    gain.gain.setValueAtTime(.18,now);
                    gain.gain.exponentialRampToValueAtTime(.001,now + .3);

                    osc.start(now);
                    osc.stop(now + .3);
                }

                else if(type === 'incorrect'){
                    osc.type='triangle';
                    osc.frequency.setValueAtTime(146.83,now);
                    osc.frequency.linearRampToValueAtTime(98.00,now + .25);

                    gain.gain.setValueAtTime(.25,now);
                    gain.gain.exponentialRampToValueAtTime(.001,now + .25);

                    osc.start(now);
                    osc.stop(now + .25);
                }

                else if(type === 'tap'){
                    osc.type='sine';
                    osc.frequency.setValueAtTime(600,now);

                    gain.gain.setValueAtTime(.06,now);
                    gain.gain.exponentialRampToValueAtTime(.001,now + .05);

                    osc.start(now);
                    osc.stop(now + .05);
                }

            }catch(e){}
        }
    };

    function triggerHaptic(type){
        if(!navigator.vibrate) return;

        if(type === 'tap') navigator.vibrate(12);
        else if(type === 'success') navigator.vibrate(35);
        else if(type === 'error') navigator.vibrate([60,40,100]);
    }

    function handleTap(){
        SoundFX.play('tap');
        triggerHaptic('tap');
    }

    let currentMode = 'blitz';
    let currentIndex = 0;
    let currentPool = [];
    let isVerifying = false;

    let answerProgress = [];
    let clickedChipsStack = [];
    let currentSlots = [];
    let finalChunks = [];

    function switchMode(mode){
        if(isVerifying) return;

        handleTap();
        currentMode = mode;

        ['blitz','spell','context'].forEach(m=>{
            const btn = document.getElementById(`btn-mode-${m}`);
            if(btn){
                btn.className = m === mode
                ? "flex-1 py-3.5 px-2 rounded-2xl text-xs font-black text-center bg-gradient-to-r from-indigo-500 to-purple-600 text-white shadow-md transition-all transform scale-[1.02]"
                : "flex-1 py-3.5 px-2 rounded-2xl text-xs font-bold text-center bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 transition-all";
            }
        });

        restartGame();
    }

    function restartGame(){
        document.getElementById('settle-modal').classList.add('hidden');

        currentIndex = 0;
        isVerifying = false;

        currentPool = [...a1Vocabulary]
            .sort(()=>Math.random()-0.5)
            .slice(0,10);

        loadQuestion();
    }

    function updateDashboard(){
        document.getElementById('progress-text').innerText =
            `${currentIndex} / ${currentPool.length}`;

        document.getElementById('game-progress').style.width =
            `${(currentIndex/currentPool.length)*100}%`;
    }

    function loadQuestion(){
        if(currentIndex >= currentPool.length){
            document.getElementById('settle-modal').classList.remove('hidden');
            SoundFX.play('correct');
            triggerHaptic('success');
            return;
        }

        updateDashboard();
        isVerifying = false;

        const item = currentPool[currentIndex];
        const obs = document.getElementById('options-box');
        const spb = document.getElementById('spell-box');
        const qctx = document.getElementById('question-ctx');
        const qtxt = document.getElementById('question-text');

        obs.innerHTML = '';
        obs.classList.remove('pointer-events-none');

        document.getElementById('spell-preview').innerHTML = '';
        document.getElementById('spell-chips').innerHTML = '';

        const card = document.getElementById('arena-card');
        card.classList.add('pop-in');

        setTimeout(()=>{
            card.classList.remove('pop-in');
        },400);

        obs.classList.remove('hidden');
        spb.classList.add('hidden');

        // 1. 词义辨析模式
        if(currentMode === 'blitz'){
            qctx.className = "text-xs font-black bg-indigo-50 text-indigo-700 rounded-full px-4 py-1.5 min-h-[26px]";
            qctx.innerText = "✉️ 请选择正确的邀请与应答词汇释义";
            qtxt.innerText = item.w;

            let choices = [item.t];
            while(choices.length < 4){
                let r = a1Vocabulary[Math.floor(Math.random()*a1Vocabulary.length)].t;
                if(!choices.includes(r)){
                    choices.push(r);
                }
            }
            choices.sort(()=>Math.random()-0.5);

            choices.forEach(c=>{
                const btn = document.createElement('button');
                btn.className = "w-full text-left py-4 px-6 rounded-2xl bg-slate-50 hover:bg-indigo-50 border border-slate-200/70 text-base font-bold transition-all active:scale-[0.98] text-slate-700 shadow-sm";
                btn.innerText = c;
                btn.onclick = ()=>handleBlitzAnswer(c===item.t,btn,item);
                obs.appendChild(btn);
            });
        }

        // 2. 字母拼词模式
        else if(currentMode === 'spell'){
            qctx.className = "text-xs font-black bg-purple-50 text-purple-700 rounded-full px-4 py-1.5 min-h-[26px]";
            qctx.innerText = "🧠 根据中文释义拼写德语";
            qtxt.innerHTML = `<span class="text-xl font-black text-slate-800">${item.t}</span>`;

            obs.classList.add('hidden');
            spb.classList.remove('hidden');

            answerProgress = [];
            clickedChipsStack = [];
            currentSlots = [];
            finalChunks = [];

            let art = "";
            let main = item.w;

            if(item.w.startsWith("der ") || item.w.startsWith("die ") || item.w.startsWith("das ")){
                art = item.w.substring(0,3);
                main = item.w.substring(4);
            }

            if(art) finalChunks.push(art);
            for(let l of main){
                if(l.trim()) finalChunks.push(l);
            }

            let groupWrapper = document.createElement('div');
            groupWrapper.className = "inline-flex bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-sm overflow-hidden font-black text-lg transition-all";
            document.getElementById('spell-preview').appendChild(groupWrapper);

            if(art){
                let s = document.createElement('span');
                s.className = "px-2.5 py-1 text-slate-300 min-w-[36px] text-center border-r border-slate-200 transition-all";
                s.innerText = "•••";
                groupWrapper.appendChild(s);
                currentSlots.push(s);
            }

            for(let i=0;i<main.length;i++){
                if(!main[i].trim()) continue;
                let s = document.createElement('span');
                s.className = `px-1.5 py-1 text-slate-300 w-6 text-center ${i === main.length - 1 ? '' : 'border-r border-slate-200/60'} transition-all`;
                s.innerText = "•";
                groupWrapper.appendChild(s);
                currentSlots.push(s);
            }

            [...finalChunks].sort(()=>Math.random()-0.5).forEach(ch=>{
                const chip = document.createElement('button');
                chip.className = "py-2 px-4 rounded-xl bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 font-black text-lg text-indigo-700 active:scale-90 shadow-sm transition-all";
                chip.innerText = ch;

                chip.onclick = () => {
                    if(isVerifying) return;
                    handleTap();

                    chip.classList.add('opacity-0','pointer-events-none','scale-75');
                    clickedChipsStack.push(chip);

                    let ts = currentSlots[answerProgress.length];
                    ts.innerText = ch;
                    ts.classList.replace('text-slate-300','text-indigo-600');
                    answerProgress.push(ch);

                    if(answerProgress.length === finalChunks.length){
                        isVerifying = true;
                        let userStr = art
                            ? answerProgress[0] + " " + answerProgress.slice(1).join("")
                            : answerProgress.join("");

                        if(userStr === item.w){
                            SoundFX.play('correct');
                            triggerHaptic('success');

                            currentSlots.forEach(s=>{
                                s.className = s.className.replace('text-indigo-600','text-white bg-indigo-500 border-transparent');
                            });

                            groupWrapper.className = "inline-flex bg-indigo-500 rounded-xl p-1 border border-indigo-600 shadow-md font-black text-lg transition-all transform scale-105";
                            qctx.innerHTML = `<span class="text-indigo-600 font-black">🧠 拼写完全正确！</span>`;

                            setTimeout(()=>{
                                currentIndex++;
                                loadQuestion();
                            },2000);
                        }
                        else{
                            SoundFX.play('incorrect');
                            triggerHaptic('error');

                            card.classList.add('card-shake','border-rose-400');
                            currentSlots.forEach(s=>{
                                s.className = s.className.replace('text-indigo-600','text-white bg-rose-500 border-transparent');
                            });

                            groupWrapper.className = "inline-flex bg-rose-500 rounded-xl p-1 border border-rose-600 shadow-md font-black text-lg transition-all";
                            qctx.innerHTML = `❌ 正确答案：<b class="text-indigo-600 text-sm block mt-0.5">${item.w}</b>`;

                            setTimeout(()=>{
                                card.classList.remove('card-shake','border-rose-400');
                            },450);

                            setTimeout(()=>{
                                isVerifying = false;
                                loadQuestion();
                            },2500);
                        }
                    }
                };
                document.getElementById('spell-chips').appendChild(chip);
            });
        }

        // 3. 语境填空模式
        else if(currentMode === 'context'){
            qctx.className = "text-xs font-black bg-pink-50 text-pink-700 rounded-full px-4 py-1.5 min-h-[26px]";
            qctx.innerText = "🎉 根据社交场景选择正确单词";

            let borderSolid = 'inline-block min-w-[80px] border-b-2 border-slate-700 mx-1.5 h-1';
            qtxt.innerHTML = `
                <div class="leading-loose text-center text-xl font-bold text-slate-800">
                    ${item.s.replace("______", `<span class="${borderSolid}"></span>`)}
                </div>`;

            let choices = [...item.options];
            choices.sort(()=>Math.random()-0.5);

            choices.forEach(c=>{
                const btn = document.createElement('button');
                btn.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-slate-50 hover:bg-indigo-50 border border-slate-200 text-base font-bold transition-all active:scale-[0.98] text-slate-700 shadow-sm";
                btn.innerText = c;
                btn.onclick = ()=>handleContextAnswer(c===item.a,btn,item);
                obs.appendChild(btn);
            });
        }
    }

    function undoLastSpell(){
        if(isVerifying || clickedChipsStack.length === 0) return;

        handleTap();
        const lastChip = clickedChipsStack.pop();
        lastChip.classList.remove('opacity-0','pointer-events-none','scale-75');
        answerProgress.pop();

        let targetSpan = currentSlots[answerProgress.length];
        targetSpan.innerText = finalChunks[answerProgress.length].length > 1 ? "•••" : "•";
        targetSpan.className = targetSpan.className.replace('text-indigo-600','text-slate-300');
    }

    function handleBlitzAnswer(isCorrect,selectedBtn,item){
        if(isVerifying) return;
        isVerifying = true;

        const obs = document.getElementById('options-box');
        const qctx = document.getElementById('question-ctx');

        obs.classList.add('pointer-events-none');

        obs.querySelectorAll('button').forEach(b=>{
            if(b.innerText === item.t){
                b.className = "w-full text-left py-4 px-6 rounded-2xl bg-indigo-500 border border-indigo-400 text-base font-black text-white shadow-md ring-4 ring-indigo-100 transition-all";
            }
            else if(b === selectedBtn && !isCorrect){
                b.className = "w-full text-left py-4 px-6 rounded-2xl bg-rose-500 border border-rose-400 text-base font-black text-white shadow-sm";
            }
            else{
                b.className = "w-full text-left py-4 px-6 rounded-2xl bg-slate-50 border border-slate-200 opacity-40 text-slate-400 text-base font-medium";
            }
        });

        if(isCorrect){
            SoundFX.play('correct');
            triggerHaptic('success');
            qctx.innerHTML = `<span class="text-indigo-500 font-black">🎉 回答正确！</span>`;
            setTimeout(()=>{
                currentIndex++;
                loadQuestion();
            },1200);
        }
        else{
            SoundFX.play('incorrect');
            triggerHaptic('error');
            qctx.innerHTML = `正确释义：<b class="text-indigo-500 font-black ml-1">${item.t}</b>`;
            setTimeout(()=>{
                currentIndex++;
                loadQuestion();
            },2000);
        }
    }

    function handleContextAnswer(isCorrect,selectedBtn,item){
        if(isVerifying) return;
        isVerifying = true;

        const card = document.getElementById('arena-card');
        const obs = document.getElementById('options-box');
        const qtxt = document.getElementById('question-text');
        const qctx = document.getElementById('question-ctx');

        obs.classList.add('pointer-events-none');

        let textClass = isCorrect
            ? 'text-indigo-600 bg-indigo-50/80 border-b-2 border-indigo-500 px-3 py-0.5 rounded-lg mx-1 font-black shadow-sm'
            : 'text-rose-600 bg-rose-50/80 border-b-2 border-rose-500 px-3 py-0.5 rounded-lg mx-1 font-black shadow-sm';

        qtxt.innerHTML = `
            <div class="leading-loose text-center text-xl font-bold text-slate-800">
                ${item.s.replace("______", `<span class="${textClass}">${item.a}</span>`)}
            </div>`;

        obs.querySelectorAll('button').forEach(b=>{
            if(b.innerText === item.a){
                b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-indigo-500 border border-indigo-400 text-base font-black text-white shadow-md ring-4 ring-indigo-100 transition-all";
            }
            else if(b === selectedBtn && !isCorrect){
                b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-rose-500 border border-rose-400 text-base font-black text-white shadow-sm";
            }
            else{
                b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-slate-50 border border-slate-200 opacity-40 text-slate-400 text-base font-medium";
            }
        });

        if(isCorrect){
            SoundFX.play('correct');
            triggerHaptic('success');
            qctx.innerHTML = `<span class="text-indigo-600 font-black">✉️ 社交语境判断正确！</span>`;
        }
        else{
            SoundFX.play('incorrect');
            triggerHaptic('error');
            card.classList.add('card-shake','border-rose-400');
            qctx.innerHTML = `<span class="text-rose-500 font-black">⚡ 再观察一下对话语境！</span>`;

            setTimeout(()=>{
                card.classList.remove('card-shake','border-rose-400');
            },450);
        }

        setTimeout(()=>{
            currentIndex++;
            loadQuestion();
        },2500);
    }

    window.onload = ()=>{
        switchMode('blitz');
    };

</script>

</body>
</html>
