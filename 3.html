<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>德语A1词汇高效练习坊 — 个人信息篇 (DeutschBlitz)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .card-shake { animation: premium-shake 0.45s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes premium-shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
            40%, 60% { transform: translate3d(5px, 0, 0); }
        }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden antialiased bg-teal-50/20">

    <header class="p-4 bg-white/80 backdrop-blur-xl border-b border-slate-200/60 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center space-x-3">
            <button onclick="handleTap(); window.location.href='main.html'" class="py-1.5 px-3.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-600 font-bold rounded-xl text-xs transition-all border border-slate-200 shadow-sm">
                ← 返回
            </button>
            <h1 class="text-sm font-black text-teal-600 tracking-wide">DeutschBlitz A1</h1>
        </div>
        <div class="text-slate-500 text-xs font-bold">
            进度: <span id="progress-text" class="text-slate-700 font-black tabular-nums">0 / 10</span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-md w-full mx-auto">
        <div class="w-full bg-slate-200 h-1.5 rounded-full mb-6 p-[1px] shadow-inner">
            <div id="game-progress" class="bg-gradient-to-r from-cyan-400 via-teal-500 to-indigo-500 h-full w-0 rounded-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(20,184,166,0.3)]"></div>
        </div>

        <div id="arena-card" class="w-full bg-white rounded-[32px] p-6 shadow-[0_20px_50px_rgba(20,184,166,0.05)] border border-teal-100/80 relative flex flex-col items-center min-h-[450px] justify-between transition-all duration-300 transform">
            <div class="w-full text-center py-1 flex flex-col items-center space-y-5">
                <div id="question-ctx" class="text-xs font-bold tracking-wide bg-teal-50 border border-teal-200 text-teal-600 rounded-full px-3 py-1 min-h-[26px] flex items-center transition-all">
                    正在整备词库...
                </div>
                <div id="question-text" class="text-3xl font-black text-slate-800 w-full min-h-[120px] flex items-center justify-center tracking-wide leading-loose px-2"></div>
            </div>

            <div id="options-box" class="w-full grid grid-cols-1 gap-3.5 mt-4"></div>

            <div id="spell-box" class="w-full flex flex-col space-y-4 mt-4 hidden">
                <div id="spell-preview" class="w-full text-center min-h-[56px] flex items-center justify-center flex-wrap gap-1 py-2 bg-slate-50 rounded-2xl border border-slate-200 px-3 shadow-inner"></div>
                <div id="spell-chips" class="flex flex-wrap justify-center gap-2.5 pt-2"></div>
                <div class="flex justify-center pt-1">
                    <button onclick="undoLastSpell()" id="btn-undo" class="px-4 py-2 bg-slate-50 hover:bg-slate-100 active:scale-95 text-slate-500 font-bold text-xs rounded-xl transition-all border border-slate-200 shadow-sm flex items-center gap-1.5">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 002-2H10.828a2 2 0 00-1.414.586L3 12z"/></svg>
                        撤回一步
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 max-w-md w-full mx-auto flex gap-3.5 bg-white/70 backdrop-blur-md border-t border-slate-200 rounded-t-[24px] shadow-[0_-10px_30px_rgba(0,0,0,0.01)]">
        <button onclick="switchMode('blitz')" id="btn-mode-blitz" class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">💡 词义辨析</button>
        <button onclick="switchMode('spell')" id="btn-mode-spell" class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">🧩 字母拼词</button>
        <button onclick="switchMode('context')" id="btn-mode-context" class="flex-1 py-3 px-2 rounded-2xl text-xs font-black text-center transition-all duration-300 transform active:scale-95 shadow-sm">📖 语境填空</button>
    </footer>

    <div id="settle-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xl flex items-center justify-center p-4 hidden z-50 transition-all duration-500">
        <div class="bg-white border border-slate-200 p-8 rounded-[36px] w-full max-w-sm text-center shadow-2xl transform scale-95 transition-all pop-in">
            <div class="w-16 h-16 bg-teal-50 rounded-full flex items-center justify-center mx-auto mb-4"><span class="text-3xl animate-bounce">🏆</span></div>
            <h3 class="text-xl font-black text-slate-800 tracking-tight">通关完成!</h3>
            <p class="text-slate-500 text-xs font-medium mt-2 mb-6 px-2 leading-relaxed">恭喜！本轮精选的 10 个“个人信息与家庭生活”德语词汇已全部顺利练习完毕。</p>
            <button onclick="restartGame()" class="w-full bg-gradient-to-r from-cyan-500 via-teal-500 to-indigo-500 text-white font-black py-4 px-6 rounded-2xl shadow-lg hover:opacity-95 active:scale-95 transition-all tracking-wider text-sm">再练一局</button>
        </div>
    </div>

    <script>
        // 严格限定为 A1级别 话题: Person (个人基本信息、姓名、家庭、住所、关联网系)
        const a1Vocabulary = [
            {w:"der Name", t:"姓名/名字", s:"Wie ist Ihr ______?", a:"Name"},
            {w:"heißen", t:"名叫/称作", s:"Wie ______ Sie?", a:"heißen"},
            {w:"kommen", t:"来自/来", s:"Woher ______ Sie?", a:"kommen"},
            {w:"wohnen", t:"居住/居住在", s:"Wo ______ Sie?", a:"wohnen"},
            {w:"der Beruf", t:"职业", s:"Was sind Sie von ______?", a:"Beruf"},
            {w:"ledig", t:"单身的", s:"Ich bin nicht verheiratet, ich bin ______.", a:"ledig"},
            {w:"verheiratet", t:"已婚的", s:"Er hat eine Frau, er ist ______.", a:"verheiratet"},
            {w:"die Familie", t:"家庭/家人", s:"Meine ______ lebt in China.", a:"Familie"},
            {w:"die Kinder", t:"孩子们", s:"Wie alt sind Ihre ______?", a:"Kinder"},
            {w:"der Sohn", t:"儿子", s:"Mein ______ ist erst ein Jahr alt.", a:"Sohn"},
            {w:"die Tochter", t:"女儿", s:"Hat Herr Müller eine ______?", a:"Tochter"},
            {w:"die Eltern", t:"父母", s:"Meine ______ wohnen in Berlin.", a:"Eltern"},
            {w:"die Frau", t:"女士/妻子", s:"Das ist ______ Müller.", a:"Frau"},
            {w:"der Mann", t:"男人/丈夫", s:"Mein ______ arbeitet hier.", a:"Mann"},
            {w:"alt", t:"……岁/年老的", s:"Wie ______ bist du?", a:"alt"},
            {w:"die Adresse", t:"地址/住址", s:"Wie ist Ihre ______?", a:"Adresse"},
            {w:"die Nummer", t:"号码/电话号码", s:"Wie ist deine Telefon-______?", a:"Nummer"},
            {w:"der Freund", t:"朋友(男)", s:"Das ist mein ______ Max.", a:"Freund"},
            {w:"die Freundin", t:"朋友(女)", s:"Das ist meine ______ Julia.", a:"Freundin"},
            {w:"sprechen", t:"说/说话", s:"Welche Sprachen ______ Sie?", a:"sprechen"}
        ];

        const SoundFX = {
            ctx: null,
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
            play(type) {
                try {
                    this.init(); const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    if (type === 'correct') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now);
                        osc.frequency.setValueAtTime(659.25, now + 0.08);
                        gain.gain.setValueAtTime(0.18, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3);
                    } else if (type === 'incorrect') {
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(146.83, now);
                        osc.frequency.linearRampToValueAtTime(98.00, now + 0.25);
                        gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                        osc.start(now); osc.stop(now + 0.25);
                    } else if (type === 'tap') {
                        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
                        gain.gain.setValueAtTime(0.06, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                        osc.start(now); osc.stop(now + 0.05);
                    }
                } catch(e) {}
            }
        };

        function triggerHaptic(type) {
            if (!navigator.vibrate) return;
            if (type === 'tap') navigator.vibrate(12);
            else if (type === 'success') navigator.vibrate(35);
            else if (type === 'error') navigator.vibrate([60, 40, 100]);
        }

        function handleTap() { SoundFX.play('tap'); triggerHaptic('tap'); }

        let currentMode = 'blitz', currentIndex = 0, currentPool = [], isVerifying = false;
        let answerProgress = [], clickedChipsStack = [], currentSlots = [], finalChunks = [];

        function switchMode(mode) {
            if (isVerifying) return; handleTap(); currentMode = mode;
            ['blitz', 'spell', 'context'].forEach(m => {
                const btn = document.getElementById(`btn-mode-${m}`);
                if(btn) {
                    btn.className = m === mode 
                        ? "flex-1 py-3.5 px-2 rounded-2xl text-xs font-black text-center bg-gradient-to-r from-cyan-500 to-teal-600 text-white shadow-md transition-all transform scale-[1.02]"
                        : "flex-1 py-3.5 px-2 rounded-2xl text-xs font-bold text-center bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 transition-all";
                }
            });
            restartGame();
        }

        function restartGame() {
            document.getElementById('settle-modal').classList.add('hidden');
            currentIndex = 0; isVerifying = false;
            currentPool = [...a1Vocabulary].sort(() => Math.random() - 0.5).slice(0, 10);
            loadQuestion();
        }

        function updateDashboard() {
            document.getElementById('progress-text').innerText = `${currentIndex} / ${currentPool.length}`;
            document.getElementById('game-progress').style.width = `${(currentIndex / currentPool.length) * 100}%`;
        }

        function loadQuestion() {
            if (currentIndex >= currentPool.length) { 
                document.getElementById('settle-modal').classList.remove('hidden'); 
                SoundFX.play('correct'); triggerHaptic('success');
                return; 
            }
            updateDashboard(); isVerifying = false;

            const item = currentPool[currentIndex], obs = document.getElementById('options-box'), spb = document.getElementById('spell-box'), qctx = document.getElementById('question-ctx'), qtxt = document.getElementById('question-text');
            obs.innerHTML = ''; obs.classList.remove('pointer-events-none');
            document.getElementById('spell-preview').innerHTML = ''; document.getElementById('spell-chips').innerHTML = '';
            
            const card = document.getElementById('arena-card');
            card.classList.add('pop-in'); setTimeout(() => card.classList.remove('pop-in'), 400);

            obs.classList.remove('hidden'); spb.classList.add('hidden');

            // 模式一：词义辨析 (Cyan 青色主题)
            if (currentMode === 'blitz') {
                qctx.className = "text-xs font-black bg-cyan-50 text-cyan-700 rounded-full px-4 py-1.5 min-h-[26px]";
                qctx.innerText = "💡 选出正确的中文释义";
                qtxt.innerText = item.w;

                let choices = [item.t];
                while (choices.length < 4) {
                    let r = a1Vocabulary[Math.floor(Math.random() * a1Vocabulary.length)].t;
                    if (!choices.includes(r)) choices.push(r);
                }
                choices.sort(() => Math.random() - 0.5).forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left py-4 px-6 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200/70 text-base font-bold transition-all active:scale-[0.98] text-slate-700 shadow-sm";
                    btn.innerText = c;
                    btn.onclick = () => handleBlitzAnswer(c === item.t, btn, item);
                    obs.appendChild(btn);
                });
            } 
            // 模式二：字母拼词 (Teal 蓝绿主题)
            else if (currentMode === 'spell') {
                qctx.className = "text-xs font-black bg-teal-50 text-teal-700 rounded-full px-4 py-1.5 min-h-[26px]";
                qctx.innerText = "🧩 请根据中文释义拼出德语词汇";
                qtxt.innerHTML = `<span class="text-xl font-black text-slate-800">${item.t}</span>`;
                obs.classList.add('hidden'); spb.classList.remove('hidden');
                
                answerProgress = []; clickedChipsStack = []; currentSlots = []; finalChunks = [];
                let art = "", main = item.w;
                if (item.w.startsWith("der ") || item.w.startsWith("die ") || item.w.startsWith("das ")) { art = item.w.substring(0, 3); main = item.w.substring(4); }
                if (art) finalChunks.push(art); for (let l of main) { if(l.trim()) finalChunks.push(l); }
                
                let groupWrapper = document.createElement('div');
                groupWrapper.className = "inline-flex bg-slate-100 rounded-xl p-1 border border-slate-200 shadow-sm overflow-hidden font-black text-lg transition-all";
                document.getElementById('spell-preview').appendChild(groupWrapper);

                if (art) {
                    let s = document.createElement('span'); s.className = "px-2.5 py-1 text-slate-300 min-w-[36px] text-center border-r border-slate-200 transition-all";
                    s.innerText = "•••"; groupWrapper.appendChild(s); currentSlots.push(s);
                }
                for (let i = 0; i < main.length; i++) {
                    if (!main[i].trim()) continue;
                    let s = document.createElement('span');
                    s.className = `px-1.5 py-1 text-slate-300 w-6 text-center ${i === main.length - 1 ? '' : 'border-r border-slate-200/60'} transition-all`;
                    s.innerText = "•"; groupWrapper.appendChild(s); currentSlots.push(s);
                }

                [...finalChunks].sort(() => Math.random() - 0.5).forEach(ch => {
                    const chip = document.createElement('button');
                    chip.className = "py-2 px-4 rounded-xl bg-teal-50 border border-teal-200 hover:bg-teal-100 font-black text-lg text-teal-700 active:scale-90 shadow-sm transition-all";
                    chip.innerText = ch;
                    chip.onclick = () => {
                        if (isVerifying) return; handleTap();
                        chip.classList.add('opacity-0', 'pointer-events-none', 'scale-75');
                        clickedChipsStack.push(chip);
                        
                        let ts = currentSlots[answerProgress.length]; ts.innerText = ch;
                        ts.classList.replace('text-slate-300', 'text-teal-600');
                        answerProgress.push(ch);

                        if (answerProgress.length === finalChunks.length) {
                            isVerifying = true;
                            let userStr = art ? answerProgress[0] + " " + answerProgress.slice(1).join("") : answerProgress.join("");
                            if (userStr === item.w) {
                                SoundFX.play('correct'); triggerHaptic('success');
                                currentSlots.forEach(s => { s.className = s.className.replace('text-teal-600', 'text-white bg-emerald-500 border-transparent'); });
                                groupWrapper.className = "inline-flex bg-emerald-500 rounded-xl p-1 border border-emerald-600 shadow-md font-black text-lg transition-all transform scale-105";
                                qctx.innerHTML = `<span class="text-emerald-600 font-black">🎉 拼写正确（停留3秒）</span>`;
                                setTimeout(() => { currentIndex++; loadQuestion(); }, 3000);
                            } else {
                                SoundFX.play('incorrect'); triggerHaptic('error');
                                card.classList.add('card-shake', 'border-rose-400');
                                currentSlots.forEach(s => { s.className = s.className.replace('text-teal-600', 'text-white bg-rose-500 border-transparent'); });
                                groupWrapper.className = "inline-flex bg-rose-500 rounded-xl p-1 border border-rose-600 shadow-md font-black text-lg transition-all";
                                qctx.innerHTML = `❌ 正确答案是：<b class="text-emerald-600 text-sm block mt-0.5">${item.w}</b>`;
                                setTimeout(() => { card.classList.remove('card-shake', 'border-rose-400'); }, 450);
                                setTimeout(() => { isVerifying = false; loadQuestion(); }, 3000); 
                            }
                        }
                    };
                    document.getElementById('spell-chips').appendChild(chip);
                });
            } 
            // 模式三：语境填空 (Indigo 靛蓝主题)
            else if (currentMode === 'context') {
                qctx.className = "text-xs font-black bg-indigo-50 text-indigo-700 rounded-full px-4 py-1.5 min-h-[26px]";
                qctx.innerText = "📖 根据整句语境，选出最合适的单词填空";
                let borderSolid = 'inline-block min-w-[80px] border-b-2 border-slate-700 mx-1.5 h-1';
                qtxt.innerHTML = `<div class="leading-loose text-center text-xl font-bold text-slate-800">${item.s.replace("______", `<span class="${borderSolid}"></span>`)}</div>`;

                let choices = [item.a];
                while (choices.length < 4) {
                    let r = a1Vocabulary[Math.floor(Math.random() * a1Vocabulary.length)].a;
                    if (!choices.includes(r)) choices.push(r);
                }
                choices.sort(() => Math.random() - 0.5).forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-base font-bold transition-all active:scale-[0.98] text-slate-700 shadow-sm";
                    btn.innerText = c;
                    btn.onclick = () => handleContextAnswer(c === item.a, btn, item);
                    obs.appendChild(btn);
                });
            }
        }

        function undoLastSpell() {
            if (isVerifying || clickedChipsStack.length === 0) return;
            handleTap();
            const lastChip = clickedChipsStack.pop();
            lastChip.classList.remove('opacity-0', 'pointer-events-none', 'scale-75');
            answerProgress.pop();
            let targetSpan = currentSlots[answerProgress.length];
            targetSpan.innerText = finalChunks[answerProgress.length].length > 1 ? "•••" : "•";
            targetSpan.className = targetSpan.className.replace('text-teal-600', 'text-slate-300');
        }

        function handleBlitzAnswer(isCorrect, selectedBtn, item) {
            if (isVerifying) return; isVerifying = true;
            const card = document.getElementById('arena-card'), obs = document.getElementById('options-box'), qctx = document.getElementById('question-ctx');
            obs.classList.add('pointer-events-none');

            obs.querySelectorAll('button').forEach(b => {
                if (b.innerText === item.t) { b.className = "w-full text-left py-4 px-6 rounded-2xl bg-emerald-500 border border-emerald-400 text-base font-black text-white shadow-md ring-4 ring-emerald-100 transition-all"; }
                else if (b === selectedBtn && !isCorrect) { b.className = "w-full text-left py-4 px-6 rounded-2xl bg-rose-500 border border-rose-400 text-base font-black text-white shadow-sm"; }
                else { b.className = "w-full text-left py-4 px-6 rounded-2xl bg-slate-50 border border-slate-200 opacity-40 text-slate-400 text-base font-medium"; }
            });

            if (isCorrect) {
                SoundFX.play('correct'); triggerHaptic('success');
                qctx.innerHTML = `<span class="text-emerald-500 font-black">✨ 答对了！</span>`;
                setTimeout(() => { currentIndex++; loadQuestion(); }, 1200);
            } else {
                SoundFX.play('incorrect'); triggerHaptic('error');
                card.classList.add('card-shake', 'border-rose-400');
                qctx.innerHTML = `正确释义是：<b class="text-emerald-500 font-black ml-1">${item.t}</b>`;
                setTimeout(() => { card.classList.remove('card-shake', 'border-rose-400'); }, 450);
                setTimeout(() => { currentIndex++; loadQuestion(); }, 2200);
            }
        }

        function handleContextAnswer(isCorrect, selectedBtn, item) {
            if (isVerifying) return; isVerifying = true;
            const card = document.getElementById('arena-card'), obs = document.getElementById('options-box'), qtxt = document.getElementById('question-text'), qctx = document.getElementById('question-ctx');
            obs.classList.add('pointer-events-none');

            let textClass = isCorrect 
                ? 'text-emerald-600 bg-emerald-50/80 border-b-2 border-emerald-500 px-3 py-0.5 rounded-lg mx-1 font-black shadow-sm'
                : 'text-rose-600 bg-rose-50/80 border-b-2 border-rose-500 px-3 py-0.5 rounded-lg mx-1 font-black shadow-sm';
            
            qtxt.innerHTML = `<div class="leading-loose text-center text-xl font-bold text-slate-800">${item.s.replace("______", `<span class="${textClass}">${item.a}</span>`)}</div>`;

            obs.querySelectorAll('button').forEach(b => {
                if (b.innerText === item.a) { b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-emerald-500 border border-emerald-400 text-base font-black text-white shadow-md ring-4 ring-emerald-100 transition-all"; }
                else if (b === selectedBtn && !isCorrect) { b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-rose-500 border border-rose-400 text-base font-black text-white shadow-sm"; }
                else { b.className = "w-full text-left py-3.5 px-5 rounded-2xl bg-slate-50 border border-slate-200 opacity-40 text-slate-400 text-base font-medium"; }
            });

            if (isCorrect) {
                SoundFX.play('correct'); triggerHaptic('success');
                qctx.innerHTML = `<span class="text-emerald-600 font-black">🎉 答对了（精读停留3秒）</span>`;
            } else {
                SoundFX.play('incorrect'); triggerHaptic('error');
                card.classList.add('card-shake', 'border-rose-400');
                qctx.innerHTML = `<span class="text-rose-500 font-black">⚡ 请记忆正确语境（停留3秒）</span>`;
                setTimeout(() => { card.classList.remove('card-shake', 'border-rose-400'); }, 450);
            }
            
            setTimeout(() => { currentIndex++; loadQuestion(); }, 3000);
        }

        window.onload = () => { restartGame(); };
    </script>
</body>
</html>
